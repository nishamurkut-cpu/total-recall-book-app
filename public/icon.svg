<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Shape -->
  <path d="M 256 64 C 340 64 416 92 416 160 C 416 310 290 400 256 432 C 222 400 96 310 96 160 C 96 92 172 64 256 64 Z" 
        fill="#1e293b" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Medical Cross Embellishment -->
  <path d="M 226 140 H 286 V 216 H 362 V 276 H 286 V 352 H 226 V 276 H 150 V 216 H 226 Z" 
        fill="url(#tealGrad)" rx="12" />

  <!-- Inner Gold Core -->
  <circle cx="256" cy="246" r="24" fill="url(#goldGrad)" />

  <!-- Lettering TR -->
  <text x="256" y="255" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="central">TR</text>

  <!-- Stars / Embellishments -->
  <circle cx="256" cy="110" r="8" fill="#fbbf24" />
  <circle cx="160" cy="180" r="6" fill="#fbbf24" />
  <circle cx="352" cy="180" r="6" fill="#fbbf24" />
  <circle cx="256" cy="386" r="6" fill="#fbbf24" />

  <!-- Subtitle Ribbon Accent -->
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#fbbf24" text-anchor="middle" letter-spacing="4">TOTAL RECALL</text>
</svg>
